name: Tests et build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Laravel, React et sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none
          tools: composer:v2

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Auditer les dépendances PHP
        run: composer audit --locked

      - name: Auditer les dépendances JavaScript
        run: npm audit

      - name: Exécuter les tests Laravel
        run: php artisan test --do-not-cache-result

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Auditer les dépendances PHP
        run: composer audit --locked

      - name: Auditer les dépendances JavaScript
        run: npm audit

      - name: Compiler le frontend
        run: npm run build

      - name: Exécuter les tests Laravel
        run: php artisan test --do-not-cache-result