<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Logo InterventionHub</title>
  <desc id="description">Un symbole bleu et indigo associant un réseau central et une clé technique, accompagné du nom InterventionHub et du slogan Centralisez. Intervenez. Résolvez.</desc>

  <defs>
    <linearGradient id="brand-gradient" x1="48" y1="42" x2="272" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="tool-gradient" x1="103" y1="91" x2="221" y2="227" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E3A8A" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Brand mark -->
  <g filter="url(#soft-shadow)">
    <rect x="42" y="42" width="236" height="236" rx="58" fill="url(#brand-gradient)"/>
  </g>

  <!-- Hub connections -->
  <g fill="none" stroke="#BFDBFE" stroke-width="10" stroke-linecap="round" opacity=".95">
    <path d="M93 112 129 133"/>
    <path d="M227 106 198 132"/>
    <path d="M92 215 128 191"/>
    <path d="M228 218 199 192"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="84" cy="107" r="15"/>
    <circle cx="236" cy="98" r="15"/>
    <circle cx="82" cy="222" r="15"/>
    <circle cx="238" cy="226" r="15"/>
  </g>

  <!-- Central technical hub / wrench -->
  <circle cx="160" cy="160" r="64" fill="#1E3A8A" opacity=".26"/>
  <path d="M199 103c-13-7-30-5-41 6-12 12-14 30-6 44l-48 48a14 14 0 0 0 20 20l48-48c14 8 32 6 44-6 11-11 13-28 6-41l-24 24-23-6-6-23 24-24c2 2 4 4 6 6Z" fill="url(#tool-gradient)"/>
  <circle cx="114" cy="211" r="6.5" fill="#2563EB"/>

  <!-- Wordmark -->
  <text x="330" y="154" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="760" letter-spacing="-2.4">
    Intervention<tspan fill="#2563EB">Hub</tspan>
  </text>
  <text x="334" y="208" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="2.2">
    CENTRALISEZ. INTERVENEZ. RÉSOLVEZ.
  </text>
</svg>
